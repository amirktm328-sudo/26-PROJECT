<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра с фигурами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Игра с фигурами</h1>

    <!-- Блок настроек времени и счета -->
    <div class="controls">
        <label for="time-input">Время (сек): </label>
        <input type="number" id="time-input" value="10" min="1" max="60">
        
        <button id="create">Начать игру</button>
    </div>

    <h2>Очки: <span id="score">0</span></h2>
    <h2>Осталось времени: <span id="time">10</span> сек</h2>

    <div id="game"></div>

    <script src="script.js"></script>
</body>
</html>
